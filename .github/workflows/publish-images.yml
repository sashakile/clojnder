name: Publish container images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for local image
        id: meta_local
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clojnder
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.local
          push: true
          tags: ${{ steps.meta_local.outputs.tags }}
          labels: ${{ steps.meta_local.outputs.labels }}

      - name: Extract metadata for Binder base image
        id: meta_binder
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clojnder-binder-base
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push Binder base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.binder-base
          push: true
          tags: ${{ steps.meta_binder.outputs.tags }}
          labels: ${{ steps.meta_binder.outputs.labels }}
