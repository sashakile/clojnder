name: Validate Binder build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  binder-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Binder image
        run: docker build -f .binder/Dockerfile .
