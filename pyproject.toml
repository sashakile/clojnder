[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clay-jupyter-proxy"
version = "0.1.0"
description = "Jupyter Server Proxy launcher and Clay Preview JupyterLab extension for Clojure/Clay on Binder"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."jupyter_serverproxy_servers"]
clay = "clay_jupyter_proxy:setup_clay"

[project.entry-points."jupyter_labextension"]
clay_jupyter_proxy = "clay_jupyter_proxy"

[project.entry-points."jupyter_server.extension_points"]
clay_jupyter_proxy = "clay_jupyter_proxy.extension:ClayPreviewExtension"

[tool.setuptools.packages.find]
include = ["clay_jupyter_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
